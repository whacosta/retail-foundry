<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Foundry - Análisis de Localidades</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Retail Foundry</h1>
                <p class="subtitle">Análisis de factibilidad para tiendas de retail</p>
            </div>
            <div class="header-buttons">
                <button id="downloadTemplateBtn" class="btn btn-secondary">
                    <span class="btn-text-full">📄 Plantilla Excel</span>
                    <span class="btn-text-short">📄 Plantilla</span>
                </button>
                <button id="exportBtn" class="btn btn-secondary">
                    <span class="btn-text-full">📥 Exportar Datos</span>
                    <span class="btn-text-short">📥 Exportar</span>
                </button>
                <button id="importBtn" class="btn btn-secondary">
                    <span class="btn-text-full">📤 Importar Datos</span>
                    <span class="btn-text-short">📤 Importar</span>
                </button>
                <button id="configBtn" class="btn btn-secondary" onclick="window.location.href='settings.html'">
                    <span class="btn-text-full">⚙️ Configuración</span>
                    <span class="btn-text-short">⚙️ Config</span>
                </button>
                <button id="newLocationBtn" class="btn btn-primary">
                    <span class="btn-text-full">+ Nueva Localidad</span>
                    <span class="btn-text-short">+ Nueva</span>
                </button>
            </div>
        </header>

        <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display: none;">
        
        <div id="templateModal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 400px;">
                <span class="close-template">&times;</span>
                <h2>Descargar Plantilla</h2>
                <p>Descargue la plantilla de Excel para importar datos al sistema.</p>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary close-template-btn">Cancelar</button>
                    <button type="button" id="downloadTemplateBtn" class="btn btn-primary">📥 Descargar Plantilla</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Buscar localidad..." class="search-input">
            <select id="sortSelect" class="sort-select">
                <option value="id">Ordenar por ID</option>
                <option value="name">Ordenar por Nombre</option>
            </select>
            <select id="orderSelect" class="order-select">
                <option value="DESC">Descendente</option>
                <option value="ASC">Ascendente</option>
            </select>
        </div>

        <div class="table-container">
            <table id="locationsTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" title="Seleccionar todas"></th>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Zona de Movilidad</th>
                        <th>Ubicación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button id="prevBtn" class="btn btn-secondary">Anterior</button>
            <span id="pageInfo"></span>
            <button id="nextBtn" class="btn btn-secondary">Siguiente</button>
        </div>
    </div>



    <footer style="text-align: center; padding: 20px; margin-top: 40px; border-top: 2px solid #e0e0e0; color: #666;">
        <p style="margin: 0; font-size: 0.9em;">
            Powered by <a href="https://github.com/whacosta" target="_blank" rel="noopener noreferrer" style="color: #667eea; text-decoration: none; font-weight: 600;">@whacosta</a>
        </p>
    </footer>

    <script type="module" src="static/js/app.js"></script>
</body>
</html>
