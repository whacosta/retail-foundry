<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localidad - Retail Foundry</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="pageTitle">Nueva Localidad</h1>
                <p class="subtitle" id="pageSubtitle">Crear una nueva localidad para análisis</p>
            </div>
            <div class="header-buttons">
                <button id="exportLocationBtn" class="btn btn-info">📊 Exportar Localidad</button>
                <a href="index.html" class="btn btn-secondary">← Volver</a>
            </div>
        </header>

        <div class="location-container" id="locationContainer">
            <div class="loading" id="loading" style="display: none;">Cargando localidad...</div>
            
            <form id="locationForm" style="display: none;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="locationId">ID de la Localidad *</label>
                        <input type="number" id="locationId" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="name">Nombre de la localidad *</label>
                        <input type="text" id="name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="locationType">Tipo de Localidad *</label>
                        <select id="locationType" required>
                            <option value="">Seleccione un tipo...</option>
                        </select>
                    </div>
                    <div class="form-group input-with-symbol" data-symbol="m²">
                        <label for="locationSize">Tamaño (m²) *</label>
                        <input type="number" id="locationSize" step="0.01" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="latitude">Latitud *</label>
                        <input type="number" id="latitude" step="any" min="-90" max="90" required title="La latitud debe estar entre -90 y 90">
                    </div>
                    <div class="form-group">
                        <label for="longitude">Longitud *</label>
                        <input type="number" id="longitude" step="any" min="-180" max="180" required title="La longitud debe estar entre -180 y 180">
                    </div>
                </div>

                <div id="mapContainer" style="margin-top: 20px; display: block;">
                    <h3>Ubicación en el mapa</h3>
                    <p style="font-size:0.9rem; color:#555; margin-bottom:8px;">
                        Arrastra el marcador para ajustar las coordenadas de la localidad.
                    </p>
                    <div id="map" style="width:100%; height:380px; border:1px solid #d8d8d8; border-radius:8px;"></div>
                </div>

                <h3>Información Demográfica</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="provincia">Provincia *</label>
                        <input type="text" id="provincia" required>
                    </div>
                    <div class="form-group">
                        <label for="canton">Cantón *</label>
                        <input type="text" id="canton" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="parroquia">Parroquia *</label>
                        <input type="text" id="parroquia" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección *</label>
                        <input type="text" id="direccion" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobilityZone">Zona de Movilidad *</label>
                    <select id="mobilityZone" required>
                        <option value="">Seleccione una zona...</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="homes5Min">Hogares 5min *</label>
                        <input type="number" id="homes5Min" required>
                    </div>
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentHomes5">% Hogares 5min (según zona)</label>
                        <input type="number" id="percentHomes5" step="0.01" readonly class="readonly-input">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="homes10Min">Hogares 10min *</label>
                        <input type="number" id="homes10Min" required>
                    </div>
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentHomes10">% Hogares 10min (según zona)</label>
                        <input type="number" id="percentHomes10" step="0.01" readonly class="readonly-input">
                    </div>
                </div>

                <h3>Niveles Socioeconómicos (%)</h3>
                <div class="form-row">
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentNSED">% NSE D *</label>
                        <input type="number" id="percentNSED" step="0.01" required>
                    </div>
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentNSECMinus">% NSE C- *</label>
                        <input type="number" id="percentNSECMinus" step="0.01" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentNSECPlus">% NSE C+ *</label>
                        <input type="number" id="percentNSECPlus" step="0.01" required>
                    </div>
                    <div class="form-group input-with-symbol" data-symbol="%">
                        <label for="percentNSEB">% NSE B *</label>
                        <input type="number" id="percentNSEB" step="0.01" required>
                    </div>
                </div>

                <h3>Ingresos por NSE (Configuración Global)</h3>
                <div class="form-row">
                    <div class="form-group input-with-symbol currency" data-symbol="$">
                        <label for="incomeD">Ingresos D</label>
                        <input type="number" id="incomeD" step="0.01" readonly class="readonly-input">
                    </div>
                    <div class="form-group input-with-symbol currency" data-symbol="$">
                        <label for="incomeCMinus">Ingresos C-</label>
                        <input type="number" id="incomeCMinus" step="0.01" readonly class="readonly-input">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group input-with-symbol currency" data-symbol="$">
                        <label for="incomeCPlus">Ingresos C+</label>
                        <input type="number" id="incomeCPlus" step="0.01" readonly class="readonly-input">
                    </div>
                    <div class="form-group input-with-symbol currency" data-symbol="$">
                        <label for="incomeB">Ingresos B</label>
                        <input type="number" id="incomeB" step="0.01" readonly class="readonly-input">
                    </div>
                </div>

                <div class="form-group input-with-symbol" data-symbol="%">
                    <label for="percentExpenses">% Gastos (según zona)</label>
                    <input type="number" id="percentExpenses" step="0.01" readonly class="readonly-input">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { 
            initStorage, 
            getMobilityZones, 
            getLocationById, 
            createLocation, 
            updateLocation,
            getGlobalConfig 
        } from './static/js/storage.js';
        import { COMPETITOR_TYPES } from './static/js/constants.js';
        import LocationPageManager from './static/js/locationPage.js';

        // Inicializar storage y cargar la página
        initStorage();
        const manager = new LocationPageManager();
        manager.init();
    </script>
</body>
</html>
